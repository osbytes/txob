name: Running Code Coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: txob
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok' && break
            sleep 1
          done
          until docker exec mongo mongosh --quiet --eval 'rs.status().members[0].stateStr' | grep -q PRIMARY; do sleep 1; done

      - name: Start Redis and DynamoDB Local
        run: |
          docker run -d --name redis -p 6379:6379 redis:8-alpine
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local:latest

      - name: Typecheck
        run: yarn typecheck

      - name: Run the tests
        run: yarn test:ci
        env:
          TXOB_TEST_PG_URL: postgres://postgres:txob@localhost:5432/postgres
          TXOB_TEST_MONGO_URL: mongodb://localhost:27017/?directConnection=true
          TXOB_TEST_REDIS_URL: redis://localhost:6379
          TXOB_TEST_DYNAMODB_URL: http://localhost:8000

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
